---
name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        browser: ['chrome', 'firefox']
        gemfile: ['Gemfile', 'gemfiles/low_spec.gemfile']
        exclude:
          # Cucumber v8.x cannot run ruby 3.4+ - this was fixed in cucumber v9.2.1
          # Revisit these exclusions once low spec cucumber is < 10
          - { ruby: '3.4', gemfile: 'gemfiles/low_spec.gemfile' }
          - { ruby: '4.0', gemfile: 'gemfiles/low_spec.gemfile' }
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec cucumber --publish-quiet
      - run: bundle exec rubocop
